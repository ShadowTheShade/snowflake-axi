# Runs the build, the unit suite, and the integration suite. No Snowflake
# credentials are configured in CI, so the integration suite exercises its
# credential-free half: offline CLI behaviors and the doc drift guard; live
# account tests skip themselves.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
